<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Course Feedback</title>
</head>
<body>
    <!-- 1. Header Div -->
    <div class="card header-div">
      <p>
        <h1>MPH <span>- Your Personal Book Store</span></h1>
      </p>
    </div>
    <!-- 2. Contact Form Div -->
    <div class="card contact-div">
      <h2>Contact form div</h2>
      <form action="#">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="user@example.com" required>

        <label for="contact-date">Preferred Contact Date:</label>
        <input type="date" id="contact-date" name="contact-date">

        <label for="satisfaction">Satisfaction Rating:</label>
        <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">

        <input type="submit" value="Submit">
      </form>
    </div>
   <!-- 3. Calculator Div -->
    <div class="card calculator-div">
      <h2>Calculator div</h2>
      <form oninput="result.value = (parseFloat(num1.value) || 0) + (parseFloat(num2.value) || 0)">
        <label for="num1">First Number:</label>
        <input type="number" id="num1" name="num1" value="0">

        <label for="num2">Second Number:</label>
        <input type="number" id="num2" name="num2" value="0">

        <label>Sum Live:</label>
        <output name="result" for="num1 num2">0</output>
      </form>
    </div>
    <!-- 4. Footer Div -->
    <div class="card footer-div">
      <h2>Footer div</h2>
      <p>Contact: support@MPH.com</p>
      <p>&copy; MPH. All rights reserved.</p>
    </div>
</body>
</html>
